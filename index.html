<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Ledger">
<meta name="theme-color" content="#1B4332">
<title>The Daily Ledger</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #f5f0e8;
  color: #2b2b2b;
  min-height: 100dvh;
}

/* ---- TOP BAR ---- */
.topbar {
  background: #1b4332;
  color: #fff;
  padding: 0 16px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar h1 {
  font-size: 18px;
  font-weight: 600;
  flex: 1;
}
.topbar-btn {
  background: rgba(255,255,255,0.15);
  border: none;
  color: #fff;
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}
.topbar-btn:active { background: rgba(255,255,255,0.25); }
.topbar-btn.on { background: #3f6b4a; }

/* ---- TABS ---- */
.tabs-wrap {
  background: #fff;
  border-bottom: 1px solid #ddd;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  display: flex;
}
.tab-btn {
  border: none;
  background: transparent;
  padding: 14px 18px;
  font-size: 14px;
  color: #666;
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 3px solid transparent;
  flex-shrink: 0;
}
.tab-btn.active {
  color: #1b4332;
  border-bottom-color: #1b4332;
  font-weight: 600;
}

/* ---- CONTENT ---- */
.content { padding: 16px; max-width: 700px; margin: 0 auto; }

/* ---- CARD ---- */
.card {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

/* ---- FORM ---- */
.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 12px;
}
.form-group label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #888;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 12px;
  border: 1.5px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  font-family: inherit;
  background: #fff;
  color: #2b2b2b;
  -webkit-appearance: none;
  appearance: none;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: #1b4332;
}
.form-row {
  display: flex;
  gap: 10px;
}
.form-row .form-group { flex: 1; }
.btn {
  width: 100%;
  padding: 14px;
  background: #1b4332;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 4px;
}
.btn:active { background: #2d6a4f; }

/* ---- DUE BANNER ---- */
.due-banner {
  background: #a33d33;
  color: #fff;
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 16px;
  font-size: 14px;
  line-height: 1.6;
  display: none;
}
.due-banner.show { display: block; }

/* ---- LIST ---- */
.list-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid #f0ebe0;
}
.list-item:last-child { border-bottom: none; }
.list-item input[type="checkbox"] {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  cursor: pointer;
  accent-color: #3f6b4a;
  margin-top: 2px;
}
.item-body { flex: 1; min-width: 0; }
.item-title {
  font-size: 15px;
  font-weight: 500;
  word-break: break-word;
}
.item-title.done { text-decoration: line-through; color: #aaa; }
.item-meta {
  font-size: 12px;
  color: #999;
  margin-top: 3px;
}
.item-meta.late { color: #a33d33; font-weight: 600; }
.item-amount {
  font-size: 14px;
  font-weight: 600;
  color: #1b4332;
  white-space: nowrap;
  flex-shrink: 0;
}
.item-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.icon-btn {
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 6px;
  font-size: 15px;
  color: #999;
}
.icon-btn:hover, .icon-btn:active { color: #a33d33; background: #fdf0ee; }
.icon-btn.edit:hover, .icon-btn.edit:active { color: #1b4332; background: #edf4f0; }
.fav-btn { color: #ccc; }
.fav-btn.on { color: #e53935; }

/* ---- PRIORITY ---- */
.p-tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  margin-right: 6px;
  text-transform: uppercase;
}
.p-high { background: #fde8e6; color: #c0392b; }
.p-medium { background: #fef5e4; color: #d68910; }
.p-low { background: #eaf4ee; color: #3f6b4a; }

/* ---- TOTAL ---- */
.total-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0 0;
  border-top: 2px solid #1b4332;
  margin-top: 8px;
}
.total-label { font-size: 14px; color: #666; font-weight: 500; }
.total-value { font-size: 20px; font-weight: 700; color: #1b4332; }

/* ---- GOAL CARD ---- */
.goal-card {
  background: #fff;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 10px;
  border-left: 4px solid #b9924a;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.goal-card.achieved { border-left-color: #3f6b4a; opacity: 0.7; }
.goal-card.missed { border-left-color: #a33d33; }
.goal-title { font-size: 15px; font-weight: 600; margin-bottom: 5px; }
.goal-desc { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 8px; }
.goal-date { font-size: 12px; color: #999; margin-bottom: 8px; }
.goal-date.late { color: #a33d33; font-weight: 600; }
.goal-progress { margin-bottom: 8px; }
.goal-progress input[type="range"] { width: 100%; accent-color: #3f6b4a; }
.goal-pct { font-size: 12px; color: #999; margin-bottom: 4px; }
.progress-bar-bg { height: 6px; background: #eee; border-radius: 4px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: #3f6b4a; border-radius: 4px; transition: width 0.2s; }
.goal-footer { display: flex; justify-content: space-between; align-items: center; }

/* ---- STICKY ---- */
.sticky-note {
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.sticky-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.sticky-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; color: rgba(0,0,0,0.8); }
.sticky-desc { font-size: 13px; color: rgba(0,0,0,0.65); line-height: 1.5; margin-bottom: 8px; }
.sticky-date { font-size: 11px; color: rgba(0,0,0,0.5); margin-bottom: 8px; }
.sticky-date.late { color: #a33d33; font-weight: 600; }
.sticky-colors { display: flex; gap: 6px; flex-wrap: wrap; }
.color-dot {
  width: 20px; height: 20px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
}
.color-dot.active { border-color: rgba(0,0,0,0.4); transform: scale(1.2); }

/* ---- HISTORY ---- */
.history-toggle {
  width: 100%;
  background: transparent;
  border: none;
  border-top: 1px dashed #ddd;
  padding: 10px 0;
  font-size: 12px;
  color: #999;
  cursor: pointer;
  text-align: left;
  margin-top: 8px;
}
.history-section { display: none; }
.history-section.open { display: block; }
.history-item .item-title { color: #aaa; }

/* ---- SECTION HEADER ---- */
.section-header {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #999;
  margin-bottom: 10px;
}

/* ---- EMPTY ---- */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: #bbb;
  font-size: 15px;
}

/* ---- MODAL ---- */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal-bg.show { display: flex; }
.modal-box {
  background: #fff;
  border-radius: 16px;
  padding: 24px;
  width: 100%;
  max-width: 360px;
  max-height: 90dvh;
  overflow-y: auto;
}
.modal-box h3 { font-size: 18px; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-actions .btn { margin-top: 0; }
.btn-cancel {
  flex: 1;
  padding: 14px;
  background: #f5f0e8;
  color: #444;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  cursor: pointer;
}
.btn-danger {
  flex: 1;
  padding: 14px;
  background: #a33d33;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

/* ---- ADD CATEGORY ICONS ---- */
.icon-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
}
.icon-pick {
  width: 40px; height: 40px;
  border-radius: 8px;
  border: 2px solid #ddd;
  background: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.icon-pick.active { border-color: #1b4332; background: #edf4f0; }

/* ---- DARK MODE ---- */
body.dark {
  background: #0f1a14;
  color: #e0d8c8;
}
body.dark .topbar { background: #0a2218; }
body.dark .tabs-wrap { background: #1a2e21; border-color: #2e4a38; }
body.dark .tab-btn { color: #8aab94; }
body.dark .tab-btn.active { color: #7ec8a0; border-bottom-color: #7ec8a0; }
body.dark .card { background: #1a2e21; box-shadow: none; }
body.dark .form-group input,
body.dark .form-group select,
body.dark .form-group textarea { background: #0f1a14; border-color: #2e4a38; color: #e0d8c8; }
body.dark .form-group input:focus,
body.dark .form-group select:focus { border-color: #7ec8a0; }
body.dark .list-item { border-color: #2e4a38; }
body.dark .goal-card { background: #1a2e21; }
body.dark .modal-box { background: #1a2e21; }
body.dark .btn-cancel { background: #2e4a38; color: #e0d8c8; }
body.dark .icon-pick { background: #0f1a14; border-color: #2e4a38; }
body.dark .icon-pick.active { background: #1a2e21; border-color: #7ec8a0; }
body.dark .progress-bar-bg { background: #2e4a38; }
body.dark .history-toggle { border-color: #2e4a38; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <h1 id="topTitle">The Daily Ledger</h1>
  <button class="topbar-btn" id="darkBtn">Dark</button>
  <button class="topbar-btn" id="remindBtn">Reminders</button>
</div>

<!-- TABS -->
<div class="tabs-wrap" id="tabsWrap"></div>

<!-- CONTENT -->
<div class="content">
  <div class="due-banner" id="dueBanner"></div>
  <div id="formArea"></div>
  <div id="listArea"></div>
</div>

<!-- ADD CATEGORY MODAL -->
<div class="modal-bg" id="catModal">
  <div class="modal-box">
    <h3>New category</h3>
    <div class="form-group">
      <label>Name</label>
      <input type="text" id="mCatName" placeholder="e.g. Fitness, Reading">
    </div>
    <div class="form-group">
      <label>Type</label>
      <select id="mCatType">
        <option value="todo">To-Do (tasks with date, time, priority)</option>
        <option value="checklist">Checklist (items with date and time)</option>
        <option value="grocery">Shopping list (items with cost)</option>
        <option value="goal">Future plans (goals with description)</option>
        <option value="sticky">Work board (sticky notes)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Icon</label>
      <div class="icon-grid" id="iconGrid"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="catCancel">Cancel</button>
      <button class="btn" style="flex:1" id="catSave">Add</button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-bg" id="editModal">
  <div class="modal-box">
    <h3>Edit item</h3>
    <div id="editFields"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="editCancel">Cancel</button>
      <button class="btn" style="flex:1" id="editSave">Save</button>
    </div>
  </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="modal-bg" id="delModal">
  <div class="modal-box">
    <h3>Delete this item?</h3>
    <p id="delMsg" style="font-size:14px;color:#666;margin-bottom:4px;"></p>
    <div class="modal-actions">
      <button class="btn-cancel" id="delCancel">Keep it</button>
      <button class="btn-danger" id="delConfirm">Delete</button>
    </div>
  </div>
</div>

<script>
// ===================== DATA =====================
const CATS_KEY = 'dl_cats';
const ITEM_KEY = id => 'dl_items_' + id;
const PREF_KEY = 'dl_prefs';

const ICONS = ['A','B','C','D','E','F','G','H'];
const IC = ['★','◆','◈','◎','○','□','◇','△','▷','♦','♣','♠','♥','✦','✧','◉'];
const COLORS = ['#fef08a','#86efac','#93c5fd','#fca5a5','#e9d5ff','#fed7aa','#a5f3fc','#fbcfe8'];

const DEFAULTS = [
  { id:'todo',   name:'To-Do',        type:'todo',     icon:'✓', builtin:true },
  { id:'grocery',name:'Grocery',      type:'grocery',  icon:'◈', builtin:true },
  { id:'future', name:'Future Plans', type:'goal',     icon:'◎', builtin:true },
  { id:'work',   name:'Work',         type:'sticky',   icon:'◆', builtin:true },
];

let cats = [];
let items = {};
let activeId = 'todo';
let remindersOn = false;
let darkMode = false;
let currency = 'R';
let pendingDeleteId = null;
let editingId = null;
let chosenIcon = IC[0];
let historyOpen = {};
let notifiedIds = new Set();

const CURRENCIES = ['R','$','£','€','₦','KSh','¥','₹'];

// ===================== STORAGE =====================
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}
function load(key) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : null;
  } catch(e) { return null; }
}

// ===================== BOOT =====================
function boot() {
  const saved = load(CATS_KEY);
  if (saved) {
    cats = saved;
    DEFAULTS.forEach(d => { if (!cats.find(c => c.id === d.id)) cats.push(d); });
  } else {
    cats = [...DEFAULTS];
  }
  cats.forEach(c => {
    items[c.id] = load(ITEM_KEY(c.id)) || [];
  });
  const prefs = load(PREF_KEY) || {};
  remindersOn = prefs.remindersOn || false;
  darkMode    = prefs.darkMode    || false;
  currency    = prefs.currency    || 'R';
  activeId    = cats[0].id;
  applyDark();
  renderAll();
  updateReminderBtn();
  setInterval(checkDue, 30000);
}

// ===================== HELPERS =====================
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,5);
const esc = s => (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = n => currency + ' ' + Number(n||0).toFixed(2);
const today = () => new Date().toISOString().slice(0,10);
const isPast = (d, t) => { if (!d) return false; return new Date(d + 'T' + (t||'23:59')) < new Date(); };
const dueDate = it => it.date ? new Date(it.date + 'T' + (it.time||'23:59')) : null;
const classify = it => {
  if (it.done) return 'done';
  const d = dueDate(it);
  return (d && d <= new Date()) ? 'missed' : 'active';
};
const pTag = p => {
  if (p === 'high')   return '<span class="p-tag p-high">High</span>';
  if (p === 'medium') return '<span class="p-tag p-medium">Medium</span>';
  return '<span class="p-tag p-low">Low</span>';
};
const statusTag = st => {
  if (st === 'done')   return '<span class="p-tag p-low">Done</span>';
  if (st === 'missed') return '<span class="p-tag p-high">Missed</span>';
  return '';
};
const heartBtn = (it) =>
  `<button class="icon-btn fav-btn ${it.fav?'on':''}" data-act="fav">♥</button>`;

// ===================== DARK MODE =====================
function applyDark() {
  document.body.classList.toggle('dark', darkMode);
  document.getElementById('darkBtn').textContent = darkMode ? '☀️' : 'Dark';
}
document.getElementById('darkBtn').onclick = () => {
  darkMode = !darkMode;
  applyDark();
  savePrefs();
};

// ===================== REMINDERS =====================
function updateReminderBtn() {
  const btn = document.getElementById('remindBtn');
  btn.className = 'topbar-btn' + (remindersOn ? ' on' : '');
  btn.textContent = remindersOn ? 'Reminders On' : 'Reminders';
}
document.getElementById('remindBtn').onclick = async () => {
  remindersOn = !remindersOn;
  if (remindersOn && 'Notification' in window && Notification.permission === 'default') {
    try { await Notification.requestPermission(); } catch(e) {}
  }
  savePrefs();
  updateReminderBtn();
};

// ===================== SAVE PREFS =====================
function savePrefs() {
  save(PREF_KEY, { remindersOn, darkMode, currency });
}

// ===================== DUE CHECK =====================
function checkDue() {
  const now = new Date();
  const due = [];
  cats.filter(c => c.type !== 'grocery').forEach(c => {
    (items[c.id]||[]).forEach(it => {
      if (it.done || !it.date) return;
      const d = dueDate(it);
      if (d && d <= now) due.push(it);
    });
  });
  const banner = document.getElementById('dueBanner');
  if (due.length) {
    banner.className = 'due-banner show';
    banner.innerHTML = '<strong>Due now:</strong><br>' +
      due.map(it => esc(it.title||it.name) + ' — ' + (it.date||'') + ' ' + (it.time||'')).join('<br>');
    if (remindersOn && 'Notification' in window && Notification.permission === 'granted') {
      due.forEach(it => {
        if (!notifiedIds.has(it.id)) {
          new Notification('Due: ' + (it.title||it.name), { body: it.date + ' ' + (it.time||'') });
          notifiedIds.add(it.id);
        }
      });
    }
  } else {
    banner.className = 'due-banner';
  }
}

// ===================== RENDER ALL =====================
function renderAll() {
  renderTabs();
  renderTitle();
  renderForm();
  renderList();
  checkDue();
}

// ===================== TABS =====================
function renderTabs() {
  const wrap = document.getElementById('tabsWrap');
  wrap.innerHTML = '';
  cats.forEach(c => {
    const open = (items[c.id]||[]).filter(i=>!i.done).length;
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (c.id === activeId ? ' active' : '');
    btn.textContent = c.icon + ' ' + c.name + (open ? ' ' + open : '');
    btn.onclick = () => { activeId = c.id; historyOpen = {}; renderAll(); };
    wrap.appendChild(btn);
  });
  // Add category button
  const addBtn = document.createElement('button');
  addBtn.className = 'tab-btn';
  addBtn.textContent = '+ Add';
  addBtn.onclick = openCatModal;
  wrap.appendChild(addBtn);
}

// ===================== TITLE =====================
function renderTitle() {
  const c = cats.find(c => c.id === activeId);
  document.getElementById('topTitle').textContent = c ? c.icon + ' ' + c.name : 'Daily Ledger';
}

// ===================== FORM =====================
function renderForm() {
  const c = cats.find(c => c.id === activeId);
  const a = document.getElementById('formArea');
  if (!c) { a.innerHTML = ''; return; }

  if (c.type === 'todo') {
    a.innerHTML = `
    <div class="card">
      <div class="form-group">
        <label>Task</label>
        <input type="text" id="fTitle" placeholder="What needs doing?">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="fDate" min="${today()}">
        </div>
        <div class="form-group">
          <label>Time</label>
          <input type="time" id="fTime">
        </div>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="fPriority">
          <option value="high">High</option>
          <option value="medium" selected>Medium</option>
          <option value="low">Low</option>
        </select>
      </div>
      <button class="btn" id="fBtn">Add Task</button>
    </div>`;
    document.getElementById('fBtn').onclick = addTodo;
    document.getElementById('fTitle').addEventListener('keypress', e => { if(e.key==='Enter') addTodo(); });

  } else if (c.type === 'grocery') {
    a.innerHTML = `
    <div class="card">
      <div class="form-group">
        <label>Currency</label>
        <select id="fCurrency">
          ${CURRENCIES.map(cu => `<option value="${cu}" ${cu===currency?'selected':''}>${cu}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>Item name</label>
        <input type="text" id="fItemName" placeholder="e.g. Milk, Bread">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Quantity</label>

// ===================== ADD FUNCTIONS =====================
function addTodo() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) { alert('Please enter a task name.'); return; }
  const d = document.getElementById('fDate').value;
  const t = document.getElementById('fTime').value;
  if (d && isPast(d, t||'23:59')) { alert('That date/time is in the past. Please pick a future date.'); return; }
  items[activeId].push({ id: uid(), title, date: d, time: t, priority: document.getElementById('fPriority').value, done: false, fav: false });
  document.getElementById('fTitle').value = '';
  document.getElementById('fDate').value = '';
  document.getElementById('fTime').value = '';
  save(ITEM_KEY(activeId), items[activeId]);
  renderAll();
}

function addGrocery() {

// ===================== RENDER LIST =====================
function renderList() {
  const c = cats.find(c => c.id === activeId);
  const all = items[activeId] || [];
  const la = document.getElementById('listArea');
  if (!c) { la.innerHTML = ''; return; }

  if (c.type === 'todo' || c.type === 'checklist') {
    renderDatedList(all, la, c.type);
  } else if (c.type === 'grocery') {
    renderGrocery(all, la);
  } else if (c.type === 'goal') {
    renderGoals(all, la);
  } else if (c.type === 'sticky') {
    renderSticky(all, la);
  } else {
    renderDatedList(all, la, 'checklist');
  }
}

// ---- DATED LIST (todo + checklist) ----
function renderDatedList(all, la, type) {
  const priOrder = { high:0, medium:1, low:2 };
  const active = all.filter(i => classify(i) === 'active')
    .sort((a,b) => (priOrder[a.priority||'low']||0) - (priOrder[b.priority||'low']||0) || (a.date||'').localeCompare(b.date||''));
  const hist = all.filter(i => classify(i) !== 'active')
    .sort((a,b) => (b.date||'').localeCompare(a.date||''));

  let html = '<div class="card">';
  if (!active.length) {
    html += '<div class="empty">Nothing here yet. Add one above.</div>';
  } else {
    active.forEach(it => { html += datedRow(it, type, false); });
  }
  html += '</div>';

  if (hist.length) {
    html += `<button class="history-toggle" onclick="toggleHistory('main')">
      ${historyOpen['main'] ? '▾' : '▸'} History (${hist.length})
    </button>
    <div class="history-section ${historyOpen['main'] ? 'open' : ''}" id="hist-main">
      <div class="card">`;
    hist.forEach(it => { html += datedRow(it, type, true); });
    html += '</div></div>';
  }
  la.innerHTML = html;
  attachEvents(la);
}

function datedRow(it, type, isHist) {
  const st = classify(it);
  const late = st === 'missed' && !it.done;
  const metaStr = it.date ? (it.date + (it.time ? ' at ' + it.time : '')) : 'No date';
  return `<div class="list-item ${isHist ? 'history-item' : ''}" data-id="${it.id}">
    <input type="checkbox" ${it.done ? 'checked' : ''} data-act="toggle">
    <div class="item-body">
      <div class="item-title ${it.done ? 'done' : ''}">
        ${isHist ? statusTag(st) : ''}
        ${type === 'todo' ? pTag(it.priority||'medium') : ''}
        ${esc(it.title)}
      </div>
      <div class="item-meta ${late ? 'late' : ''}">${late ? 'OVERDUE — ' : ''}${metaStr}</div>
    </div>
    ${heartBtn(it)}
    <div class="item-actions">
      <button class="icon-btn edit" data-act="edit" title="Edit">Edit</button>
      <button class="icon-btn" data-act="delete" title="Delete">✕</button>
    </div>
  </div>`;
}

// ---- GROCERY ----
function renderGrocery(all, la) {
  const notBought = all.filter(i => !i.done);
  const bought    = all.filter(i =>  i.done);
  const total = notBought.reduce((s,i) => s + (i.qty||0)*(i.price||0), 0);

  let html = '<div class="card">';
  if (!notBought.length) {
    html += '<div class="empty">List is empty. Add an item above.</div>';
  } else {
    notBought.forEach(it => {
      const sub = (it.qty||0)*(it.price||0);
      html += `<div class="list-item" data-id="${it.id}">
        <input type="checkbox" ${it.done?'checked':''} data-act="toggle">
        <div class="item-body">
          <div class="item-title">${esc(it.name)}</div>
          <div class="item-meta">Qty: ${it.qty} &times; ${fmt(it.price)}</div>
        </div>
        <div class="item-amount">${fmt(sub)}</div>
        ${heartBtn(it)}
        <div class="item-actions">
          <button class="icon-btn edit" data-act="edit">Edit</button>
          <button class="icon-btn" data-act="delete">✕</button>
        </div>
      </div>`;
    });
    html += `<div class="total-row">
      <span class="total-label">Total to buy</span>
      <span class="total-value">${fmt(total)}</span>
    </div>`;
  }
  html += '</div>';

  if (bought.length) {
    html += `<button class="history-toggle" onclick="toggleHistory('grocery')">
      ${historyOpen['grocery'] ? '▾' : '▸'} Bought (${bought.length})
    </button>
    <div class="history-section ${historyOpen['grocery'] ? 'open' : ''}" id="hist-grocery">
      <div class="card">`;
    bought.forEach(it => {
      html += `<div class="list-item history-item" data-id="${it.id}">
        <input type="checkbox" checked data-act="toggle">
        <div class="item-body">
          <div class="item-title done">${esc(it.name)}</div>
          <div class="item-meta">Qty: ${it.qty} &times; ${fmt(it.price)}</div>
        </div>
        ${heartBtn(it)}
        <button class="icon-btn" data-act="delete">✕</button>
      </div>`;
    });
    html += '</div></div>';
  }
  la.innerHTML = html;
  attachEvents(la);
}

// ---- GOALS ----
function renderGoals(all, la) {
  const active = all.filter(i => classify(i) === 'active').sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const hist   = all.filter(i => classify(i) !== 'active');

  let html = '';
  if (!active.length) {
    html += '<div class="card"><div class="empty">No goals yet. Add your first one above.</div></div>';
  } else {
    active.forEach(it => { html += goalCard(it, false); });
  }
  if (hist.length) {
    html += `<button class="history-toggle" onclick="toggleHistory('goal')">
      ${historyOpen['goal'] ? '▾' : '▸'} History (${hist.length})
    </button>
    <div class="history-section ${historyOpen['goal'] ? 'open' : ''}" id="hist-goal">`;
    hist.forEach(it => { html += goalCard(it, true); });
    html += '</div>';
  }
  la.innerHTML = html;
  attachEvents(la);
}

function goalCard(it, isHist) {
  const st = classify(it);
  const late = st === 'missed' && !it.done;
  const prog = it.progress || 0;
  return `<div class="goal-card ${it.done ? 'achieved' : late ? 'missed' : ''}" data-id="${it.id}">
    <div class="goal-title">${isHist ? statusTag(st) + ' ' : ''}${esc(it.title)}</div>
    ${it.desc ? `<div class="goal-desc">${esc(it.desc)}</div>` : ''}
    <div class="goal-date ${late?'late':''}">Target: ${it.date || 'No date set'}</div>
    <div class="goal-progress">
      <div class="goal-pct">Progress: ${prog}%</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${prog}%"></div></div>
      <input type="range" min="0" max="100" value="${prog}" data-act="progress" style="margin-top:6px">
    </div>
    <div class="goal-footer">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;">
        <input type="checkbox" ${it.done?'checked':''} data-act="toggle" style="width:20px;height:20px;"> Mark achieved
      </label>
      <div style="display:flex;gap:6px;align-items:center;">
        ${heartBtn(it)}
        <button class="icon-btn edit" data-act="edit">Edit</button>
        <button class="icon-btn" data-act="delete">✕</button>
      </div>
    </div>
  </div>`;
}

// ---- STICKY ----
function renderSticky(all, la) {
  const active = all.filter(i => classify(i) === 'active');
  const hist   = all.filter(i => classify(i) !== 'active');

  let html = '';
  if (!active.length) {
    html += '<div class="card"><div class="empty">No notes pinned. Add one above.</div></div>';
  } else {
    active.forEach(it => { html += stickyNote(it, false); });
  }
  if (hist.length) {
    html += `<button class="history-toggle" onclick="toggleHistory('sticky')">
      ${historyOpen['sticky'] ? '▾' : '▸'} History (${hist.length})
    </button>
    <div class="history-section ${historyOpen['sticky'] ? 'open' : ''}" id="hist-sticky">`;
    hist.forEach(it => { html += stickyNote(it, true); });
    html += '</div>';
  }
  la.innerHTML = html;
  attachEvents(la);
}

function stickyNote(it, isHist) {
  const st = classify(it);
  const late = st === 'missed' && !it.done;
  const color = it.color || COLORS[0];
  const dots = COLORS.map(c => `<div class="color-dot ${c===color?'active':''}" style="background:${c}" data-act="color" data-color="${c}"></div>`).join('');
  return `<div class="sticky-note" style="background:${color}" data-id="${it.id}">
    <div class="sticky-head">
      <div class="sticky-title">${isHist ? statusTag(st) + ' ' : ''}${esc(it.title)}</div>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        ${heartBtn(it)}
        <button class="icon-btn edit" data-act="edit">Edit</button>
        <button class="icon-btn" data-act="toggle">${it.done ? '↩' : '✓'}</button>
        <button class="icon-btn" data-act="delete">✕</button>
      </div>
    </div>
    ${it.desc ? `<div class="sticky-desc">${esc(it.desc)}</div>` : ''}
    <div class="sticky-date ${late?'late':''}">${it.date ? it.date + (it.time ? ' at ' + it.time : '') : 'No date'}</div>
    <div class="sticky-colors">${dots}</div>
  </div>`;
}

// ===================== EVENT DELEGATION =====================
function attachEvents(container) {
  container.addEventListener('change', async e => {
    const el = e.target;
    const act = el.getAttribute('data-act');
    const row = el.closest('[data-id]');
    if (!row) return;
    const id = row.getAttribute('data-id');
    const it = items[activeId].find(i => i.id === id);
    if (!it) return;
    if (act === 'toggle') { it.done = el.checked; save(ITEM_KEY(activeId), items[activeId]); renderAll(); }
    if (act === 'progress') {
      it.progress = parseInt(el.value);
      row.querySelector('.goal-pct').textContent = 'Progress: ' + it.progress + '%';
      row.querySelector('.progress-bar-fill').style.width = it.progress + '%';
      save(ITEM_KEY(activeId), items[activeId]);
    }
  });
  container.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.getAttribute('data-act');
    const row = el.closest('[data-id]');
    if (!row) return;
    const id = row.getAttribute('data-id');
    const it = items[activeId].find(i => i.id === id);
    if (!it) return;

    if (act === 'toggle') { it.done = !it.done; save(ITEM_KEY(activeId), items[activeId]); renderAll(); }
    if (act === 'fav')    { it.fav  = !it.fav;  save(ITEM_KEY(activeId), items[activeId]); renderAll(); }
    if (act === 'color')  { it.color = el.getAttribute('data-color'); save(ITEM_KEY(activeId), items[activeId]); renderAll(); }
    if (act === 'delete') openDeleteModal(id, it.title || it.name || 'this item');
    if (act === 'edit')   openEditModal(id);
  });
}

// ===================== HISTORY TOGGLE =====================
function toggleHistory(key) {
  historyOpen[key] = !historyOpen[key];
  renderList();
}

// ===================== DELETE MODAL =====================
function openDeleteModal(id, label) {
  pendingDeleteId = id;
  document.getElementById('delMsg').textContent = '"' + label + '" will be removed permanently.';
  document.getElementById('delModal').classList.add('show');
}
document.getElementById('delCancel').onclick = () => {
  pendingDeleteId = null;
  document.getElementById('delModal').classList.remove('show');
};
document.getElementById('delConfirm').onclick = () => {
  if (pendingDeleteId) {
    items[activeId] = items[activeId].filter(i => i.id !== pendingDeleteId);
    save(ITEM_KEY(activeId), items[activeId]);
    pendingDeleteId = null;
  }
  document.getElementById('delModal').classList.remove('show');
  renderAll();
};

};
document.getElementById('editSave').onclick = () => {

  const it = items[activeId].find(i => i.id === editingId);
  if (!it || !c) { document.getElementById('editModal').classList.remove('show'); return; }

function openCatModal() {
  document.getElementById('mCatName').value = '';
  document.getElementById('mCatType').value = 'todo';
  chosenIcon = IC[0];
  const grid = document.getElementById('iconGrid');
  grid.innerHTML = IC.map(i =>
    `<div class="icon-pick ${i===chosenIcon?'active':''}" data-icon="${i}">${i}</div>`
  ).join('');
  grid.querySelectorAll('.icon-pick').forEach(el => {
    el.onclick = () => {
      chosenIcon = el.getAttribute('data-icon');

  document.getElementById('catModal').classList.add('show');
}
document.getElementById('catCancel').onclick = () => document.getElementById('catModal').classList.remove('show');
document.getElementById('catSave').onclick = () => {
  const name = document.getElementById('mCatName').value.trim();
  if (!name) { alert('Please enter a category name.'); return; }
  const type = document.getElementById('mCatType').value;
  const id = uid();
  cats.push({ id, name, type, icon: chosenIcon, builtin: false });
  items[id] = [];
  save(CATS_KEY, cats);
  save(ITEM_KEY(id), []);
  activeId = id;
  document.getElementById('catModal').classList.remove('show');
  renderAll();
};

// Close modals on background tap
['catModal','editModal','delModal'].forEach(mid => {
  document.getElementById(mid).addEventListener('click', e => {
    if (e.target === document.getElementById(mid)) {
      document.getElementById(mid).classList.remove('show');
    }
  });
});

// ===================== START =====================
boot();
</script>
</body>
</html>
