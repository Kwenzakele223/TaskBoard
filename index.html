<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Ledger">
<meta name="theme-color" content="#4a7c59">
<title>The Daily Ledger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --p:#4a7c59;--p2:#3d6749;--p3:#6b9b7a;--p4:#8fb89c;
  --acc:#a1662f;--acc2:#c17f42;
  --ok:#3d8b5f;--ok2:#66b384;
  --red:#c0392b;--red2:#e0685a;
  --bg:#f7f5ee;--bg2:#ede6d6;--surface:#ffffff;
  --border:#ddd3bc;--border2:#c9bc9e;
  --text:#2f2a1f;--text2:#6b6152;--text3:#a89c86;
  --shadow:0 2px 16px rgba(74,124,89,0.12);
  --r:13px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;}
body.dark{
  --bg:#141812;--bg2:#1e2419;--surface:#232b1f;--border:#3a4633;--border2:#4f5f45;
  --text:#eae6da;--text2:#a8c2ab;--text3:#6f7d63;--shadow:0 2px 16px rgba(0,0,0,0.4);
}

/* ===== ONBOARDING ===== */
.ob{position:fixed;inset:0;background:linear-gradient(135deg,var(--p),var(--p3));z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;}
.ob-box{background:var(--surface);border-radius:20px;padding:32px 26px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,0.35);}
.ob-logo{font-size:26px;font-weight:800;color:var(--p);letter-spacing:-0.5px;margin-bottom:4px;}
.ob-tagline{font-size:13px;color:var(--text2);margin-bottom:26px;line-height:1.5;}

/* ===== TOP BAR ===== */
.topbar{background:linear-gradient(135deg,var(--p),var(--p3));color:#fff;height:58px;display:flex;align-items:center;padding:0 18px;gap:10px;position:sticky;top:0;z-index:20;box-shadow:0 3px 12px rgba(45,27,105,0.3);}
.topbar-logo{font-size:18px;font-weight:800;letter-spacing:-0.3px;flex:1;}
.t-btn{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;transition:background .15s;}
.t-btn:active{background:rgba(255,255,255,0.28);}
.t-btn.on{background:var(--ok);border-color:var(--ok);}

/* ===== MAIN TABS ===== */
.tabs{background:var(--surface);border-bottom:2px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.tab{border:none;background:transparent;padding:14px 18px;font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;font-family:inherit;transition:color .12s;flex-shrink:0;}
.tab.active{color:var(--p);border-bottom-color:var(--p);font-weight:700;}

/* ===== SUBTABS ===== */
.subtab-bar{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;padding:0 16px;gap:2px;display:none;}
.subtab-bar.show{display:flex;}
.stab{border:none;background:transparent;padding:10px 14px;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;white-space:nowrap;}
.stab.active{color:var(--p);border-bottom-color:var(--p);font-weight:700;}

/* ===== CONTENT ===== */
.content{padding:16px;max-width:720px;margin:0 auto;}

/* ===== BANNERS ===== */
.banner{border-radius:var(--r);padding:14px 16px;margin-bottom:14px;display:none;border-left:4px solid;}
.banner.show{display:block;}
.banner-title{font-weight:700;font-size:15px;margin-bottom:4px;}
.banner.due{background:#fdf4ff;border-color:var(--red);color:#7a1a3a;}
.banner.pay{background:#fffbeb;border-color:var(--acc);color:#78420a;}
body.dark .banner.due{background:#2a0a1a;color:#f87171;}
body.dark .banner.pay{background:#2a1a00;color:#fbbf24;}

/* ===== CARDS ===== */
.card{background:var(--surface);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border);}
.card-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);margin-bottom:14px;}

/* ===== FORMS ===== */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.fg label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);}
.fg label .req{color:var(--red);}
.fg input,.fg select,.fg textarea{
  width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:10px;
  font-size:16px;font-family:inherit;background:var(--surface);color:var(--text);
  -webkit-appearance:none;appearance:none;transition:border-color .15s;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--p);}
.fg input.err,.fg select.err,.fg textarea.err{border-color:var(--red);}
.fg textarea{resize:vertical;min-height:80px;font-size:15px !important;}
.err-msg{font-size:12px;color:var(--red);display:none;}
.err-msg.show{display:block;}
.frow{display:flex;gap:10px;}
.frow .fg{flex:1;}
@media(max-width:480px){.frow{flex-direction:column;}}

/* ===== BUTTONS ===== */
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s,transform .1s;}
.btn:active{opacity:.8;transform:scale(.99);}
.btn.primary{background:linear-gradient(135deg,var(--p),var(--p3));color:#fff;}
.btn.secondary{background:var(--bg2);color:var(--text);}
.btn.danger{background:var(--red);color:#fff;}
.btn.accent{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;}
.btn.sm{padding:8px 14px;font-size:13px;width:auto;border-radius:8px;}

/* ===== LIST ITEMS ===== */
.list-item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.li-check{width:22px;height:22px;flex-shrink:0;cursor:pointer;accent-color:var(--p);margin-top:2px;}
.li-body{flex:1;min-width:0;}
.li-title{font-size:15px;font-weight:600;word-break:break-word;line-height:1.4;}
.li-title.done{text-decoration:line-through;color:var(--text3);}
.li-meta{font-size:12px;color:var(--text3);margin-top:3px;line-height:1.5;}
.li-meta.late{color:var(--red);font-weight:600;}
.li-desc{font-size:13px;color:var(--text2);margin-top:4px;line-height:1.5;}
.li-amount{font-size:15px;font-weight:700;color:var(--ok);flex-shrink:0;}
.li-actions{display:flex;gap:4px;flex-shrink:0;align-items:center;}
.ab{background:transparent;border:none;cursor:pointer;padding:6px 8px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text3);font-family:inherit;}
.ab:active{background:var(--bg2);}
.fav-btn{font-size:18px;color:#ddd;}
.fav-btn.on{color:#e53935;}

/* ===== PRIORITY TAGS ===== */
.ptag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;margin-right:4px;text-transform:uppercase;letter-spacing:.3px;}
.ptag.high{background:#fee2e2;color:#b91c1c;}
.ptag.medium{background:#fef3c7;color:#b45309;}
.ptag.low{background:#d1fae5;color:#065f46;}
body.dark .ptag.high{background:#3a1010;color:#f87171;}
body.dark .ptag.medium{background:#3a2a00;color:#fbbf24;}
body.dark .ptag.low{background:#00231a;color:#34d399;}

/* ===== STATUS TAGS ===== */
.stag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;margin-right:4px;text-transform:uppercase;}
.stag.done{background:#d1fae5;color:#065f46;}
.stag.missed{background:#fee2e2;color:#b91c1c;}

/* ===== GROCERY ===== */
.total-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0 0;border-top:2px solid var(--p);margin-top:8px;}
.total-lbl{font-size:14px;color:var(--text2);font-weight:600;}
.total-val{font-size:22px;font-weight:700;color:var(--p);}

/* ===== GOAL CARDS ===== */
.goal-card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:10px;border-left:4px solid var(--acc);box-shadow:var(--shadow);}
.goal-card.done-g{border-left-color:var(--ok);opacity:.65;}
.goal-card.missed-g{border-left-color:var(--red);}
.gc-title{font-size:15px;font-weight:700;margin-bottom:5px;}
.gc-desc{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:8px;}
.gc-date{font-size:12px;color:var(--text3);margin-bottom:8px;}
.gc-date.late{color:var(--red);font-weight:600;}
.prog-bg{height:7px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-bottom:6px;}
.prog-fill{height:100%;border-radius:99px;transition:width .3s;background:var(--p3);}
.prog-fill.warn{background:var(--acc);}
.prog-fill.over{background:var(--red);}
.prog-pct{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);margin-bottom:4px;}
.gc-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px;}

/* ===== STICKY NOTES ===== */
.board{display:flex;flex-direction:column;gap:12px;}
.sticky{border-radius:var(--r);padding:16px;box-shadow:0 3px 12px rgba(0,0,0,0.1);transition:transform .15s,box-shadow .15s;}
.sticky:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.14);}
.sticky.done-s{opacity:.5;}
.sticky-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.sticky-title{font-size:15px;font-weight:700;color:rgba(0,0,0,.82);line-height:1.3;}
.sticky-desc{font-size:13px;color:rgba(0,0,0,.65);line-height:1.55;margin-bottom:8px;word-break:break-word;}
.sticky-date{font-size:11px;color:rgba(0,0,0,.5);margin-bottom:10px;}
.sticky-date.late{color:#b91c1c;font-weight:600;}
.sticky-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.sticky-actions{display:flex;gap:4px;}
.sticky-actions button{border:none;background:rgba(0,0,0,.08);cursor:pointer;border-radius:7px;width:32px;height:32px;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .12s;}
.sticky-actions button:hover{background:rgba(0,0,0,.18);}
.colors{display:flex;gap:5px;flex-wrap:wrap;}
.cdot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s;}
.cdot.on{border-color:rgba(0,0,0,.45);transform:scale(1.2);}

/* ===== HISTORY ===== */
.hist-btn{width:100%;background:transparent;border:none;border-top:1px dashed var(--border);padding:10px 0;font-size:12px;color:var(--text3);cursor:pointer;text-align:left;margin-top:8px;font-family:inherit;}
.hist-sec{display:none;}
.hist-sec.open{display:block;padding-top:8px;}

/* ===== EMPTY ===== */
.empty{text-align:center;padding:36px 16px;color:var(--text3);font-size:15px;line-height:1.6;}

/* ===== MODAL ===== */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:center;justify-content:center;padding:16px;}
.modal-bg.show{display:flex;}
.modal-box{background:var(--surface);border-radius:18px;padding:24px;width:100%;max-width:420px;max-height:90dvh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.3);}
.modal-title{font-size:19px;font-weight:700;margin-bottom:18px;color:var(--text);}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.modal-actions .btn{margin-top:0;}
.m-cancel{flex:1;padding:14px;background:var(--bg2);color:var(--text);border:none;border-radius:10px;font-size:15px;cursor:pointer;font-family:inherit;}
.m-del{flex:1;padding:14px;background:var(--red);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}

/* ===== ICON PICKER ===== */
.icon-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;}
.icon-pick{width:40px;height:40px;border-radius:9px;border:2px solid var(--border);background:var(--surface);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .12s;}
.icon-pick.on{border-color:var(--p);background:var(--bg2);}

/* ===== SETTINGS ===== */
.sw-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--border);}
.sw-row:last-child{border-bottom:none;}
.sw-label{font-size:14px;font-weight:600;}
.sw-sub{font-size:12px;color:var(--text3);margin-top:2px;}
.sw{width:46px;height:26px;border-radius:99px;border:none;cursor:pointer;position:relative;flex-shrink:0;transition:background .15s;background:var(--border2);}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .15s;}
.sw.on{background:var(--ok);}
.sw.on::after{transform:translateX(20px);}

/* ===== DARK ===== */
body.dark .card{background:var(--surface);}
body.dark .fg input,body.dark .fg select,body.dark .fg textarea{background:var(--bg);border-color:var(--border);color:var(--text);}
body.dark .fg input:focus,body.dark .fg select:focus{border-color:var(--p4);}
body.dark .modal-box{background:var(--surface);}
body.dark .m-cancel{background:var(--bg2);color:var(--text);}
body.dark .icon-pick{background:var(--bg);border-color:var(--border);}
body.dark .icon-pick.on{border-color:var(--p4);background:var(--bg2);}
body.dark .goal-card{background:var(--surface);}
body.dark .ptag.high{background:#3a1010;color:#f87171;}
body.dark .stag.done{background:#003320;color:#34d399;}
body.dark .stag.missed{background:#3a0a0a;color:#f87171;}

/* ===== BUDGET ===== */
.salary-banner{background:linear-gradient(135deg,var(--p),var(--p3));color:#fff;border-radius:var(--r);padding:20px;margin-bottom:14px;}
.salary-banner .sb-label{font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.salary-banner .sb-amount{font-size:30px;font-weight:800;margin:4px 0;}
.salary-banner .sb-sub{font-size:13px;opacity:.85;}
.summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.summary-box{background:var(--surface);border-radius:var(--r);padding:12px 8px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border);}
.summary-box .sb-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;font-weight:700;}
.summary-box .sb-val{font-size:17px;font-weight:800;word-break:break-word;}
.summary-box.red .sb-val{color:var(--red);}
.summary-box.gold .sb-val{color:var(--acc);}
.summary-box.green .sb-val{color:var(--ok);}
.result-banner{border-radius:var(--r);padding:20px;margin-bottom:14px;text-align:center;}
.result-banner.positive{background:linear-gradient(135deg,var(--ok),var(--ok2));color:#fff;}
.result-banner.negative{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;}
.result-banner .rb-label{font-size:12px;opacity:.9;margin-bottom:4px;font-weight:600;}
.result-banner .rb-amount{font-size:32px;font-weight:800;}
.result-banner .rb-sub{font-size:12px;opacity:.85;margin-top:6px;}
.result-banner .rb-tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:99px;margin-top:8px;}
.exp-table{width:100%;border-collapse:collapse;}
.exp-table th{text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);padding:6px 8px;border-bottom:2px solid var(--p);}
.exp-table th:last-child,.exp-table td:last-child{text-align:right;}
.exp-table td{padding:11px 8px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle;}
.exp-table tr:last-child td{border-bottom:none;}
.exp-table tr.paid td{opacity:.5;}
.exp-table tr.paid td.exp-name{text-decoration:line-through;}
.exp-check{width:22px;height:22px;accent-color:var(--p);cursor:pointer;flex-shrink:0;}
.exp-amt{font-weight:700;color:var(--p);font-size:14px;}
.exp-cat{font-size:11px;color:var(--text3);display:block;margin-top:2px;}
.gate-card{text-align:center;}
.gate-card p{font-size:14px;color:var(--text2);margin:10px 0 16px;line-height:1.6;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-title{font-size:16px;font-weight:700;}
.cal-nav{background:transparent;border:1.5px solid var(--border);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--text);font-family:inherit;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-day-name{text-align:center;font-size:10px;font-weight:700;color:var(--text3);padding:4px 0;text-transform:uppercase;}
.cal-day{text-align:center;padding:8px 2px;border-radius:8px;font-size:13px;position:relative;color:var(--text);}
.cal-day.other-month{color:var(--text3);opacity:.4;}
.cal-day.today{background:var(--p);color:#fff;font-weight:700;}
.cal-day.payday{background:var(--acc);color:#fff;font-weight:700;}
.cal-day.today.payday{background:linear-gradient(135deg,var(--p),var(--acc));}
.cal-day.has-exp::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--red);}
.cal-legend{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;}
.cal-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);}
.cal-legend-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
.notify-strip{background:var(--p);color:#fff;border-radius:10px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.notify-strip span{font-size:12px;line-height:1.5;}
.pay-banner{background:var(--acc);color:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-size:13px;line-height:1.6;display:none;}
.pay-banner.show{display:block;}
.pay-banner strong{display:block;font-size:15px;margin-bottom:4px;}
.cat-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.cat-pill{border:1.5px solid var(--border);background:var(--surface);color:var(--text2);border-radius:99px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.cat-pill.on{background:var(--p);border-color:var(--p);color:#fff;}
</style>
</head>
<body>

<!-- ONBOARDING (shown first time) -->
<div class="ob" id="onboard" style="display:none;">
  <div class="ob-box">
    <div class="ob-logo">The Daily Ledger</div>
    <div class="ob-tagline">Your all-in-one task and daily planner. Let's get you set up in seconds.</div>
    <div class="fg">
      <label>Your name <span class="req">*</span></label>
      <input type="text" id="obName" placeholder="e.g. Kwenzakele" maxlength="40">
      <span class="err-msg" id="obNameErr">Please enter your name.</span>
    </div>
    <div class="fg">
      <label>Preferred currency (for grocery)</label>
      <select id="obCurr">
        <option value="R">R — South African Rand</option>
        <option value="$">$ — US Dollar</option>
        <option value="£">£ — British Pound</option>
        <option value="€">€ — Euro</option>
        <option value="₦">₦ — Nigerian Naira</option>
        <option value="KSh">KSh — Kenyan Shilling</option>
      </select>
    </div>
    <button class="btn primary" id="obBtn">Get started</button>
  </div>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-logo" id="topName">Daily Ledger</div>
  <button class="t-btn" id="darkBtn">Dark</button>
  <button class="t-btn" id="remindBtn">Reminders</button>
</div>

<!-- MAIN TABS -->
<div class="tabs" id="mainTabs">
  <button class="tab active" data-tab="todo">To-Do</button>
  <button class="tab" data-tab="budget">Budget</button>
  <button class="tab" data-tab="future">Future Plans</button>
  <button class="tab" data-tab="addcat">+ Add category</button>
</div>

<!-- SUBTABS (To-Do and custom sticky) -->
<div class="subtab-bar" id="subtabBar"></div>

<div class="content">
  <div class="banner due" id="dueBanner"></div>
  <div class="pay-banner" id="payBanner"></div>
  <div id="page"></div>
</div>

<!-- ITEM MODAL (add / edit) -->
<div class="modal-bg" id="itemModal">
  <div class="modal-box">
    <div class="modal-title" id="itemModalTitle">Add item</div>
    <div id="itemFields"></div>
    <div class="modal-actions">
      <button class="m-cancel" id="itemCancel">Cancel</button>
      <button class="btn primary" style="flex:1" id="itemSave">Save</button>

</div>

<!-- ADD/EDIT EXPENSE (BUDGET) MODAL -->
<div class="modal-bg" id="expModal">
  <div class="modal-box">
    <div class="modal-title" id="expModalTitle">Add expense</div>
    <div class="fg"><label>Expense name <span class="req">*</span></label>
      <input type="text" id="expName" placeholder="e.g. Rent, Electricity" maxlength="80">
      <span class="err-msg" id="expNameErr">Please enter a name.</span></div>
    <div class="fg"><label>Amount <span class="req">*</span></label>
      <input type="number" id="expAmount" min="0.01" step="0.01" placeholder="0.00">
      <span class="err-msg" id="expAmountErr">Please enter an amount.</span></div>
    <div class="fg"><label>Category</label>
      <select id="expCategory">
        <option value="Housing">Housing</option>
        <option value="Transport">Transport</option>

        <option value="Other">Other</option>
      </select></div>

      <input type="number" id="expDueDay" min="1" max="31" placeholder="e.g. 1"></div>

      <button class="m-cancel" id="delCancel">Keep it</button>
      <button class="m-del" id="delConfirm">Delete</button>

<script>
/* ==================== STORAGE ==================== */
const db={
  get:k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};

/* ==================== CONSTANTS ==================== */
const ICONS=['★','◆','◈','◎','○','□','◇','△','▷','♦','♣','♠','✦','✧','◉','❖','⬟','⬡'];
const SCOLORS=['#fef08a','#86efac','#93c5fd','#fca5a5','#e9d5ff','#fed7aa','#a5f3fc','#fbcfe8','#d9f99d','#fde68a'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const PRIORITIES=['high','medium','low'];
const PRICOLORS={high:'var(--red)',medium:'var(--acc)',low:'var(--ok)'};
const EXP_CATS=['Housing','Transport','Utilities','Insurance','Medical','Education','Entertainment','Savings','Other'];
const GROC_CATS=['Food','Toiletries','Detergents'];

/* ==================== STATE ==================== */
let S={
  name:'',currency:'R',dark:false,reminders:false,
  cats:[],        // custom categories
  items:{},       // {catId:[...items]}
  histOpen:{},
  budget:{
    salary:0,payday:25,
    expenses:[],       // [{id,name,amount,category,dueDay}]
    ticked:{},         // {'YYYY-MM':{expId:true}}
    remindersOn:false,
    generated:{},      // {'YYYY-MM':{salary,totalExp,totalGroc,leftover,full,date}}
    calMonth:null,     // {year,month}
    grocFilter:'All',
  },
};
let activeTab='todo';
let activeSub='personal'; // personal | work
let activeBudgetSub='overview'; // overview | expenses | grocery | calendar | settings
let editId=null;
let editList=null;
let delId=null;
let delList=null;
let delType=null;
let chosenIcon=ICONS[0];
let notifLastDay='';
let editingExpId=null;
let deletingExpId=null;

/* ==================== BOOT ==================== */
function boot(){
  const saved=db.get('dl_v3');
  if(saved)Object.assign(S,saved);
  // Ensure built-in item lists exist
  ['todo_personal','todo_work','grocery','future'].forEach(id=>{
    if(!S.items[id])S.items[id]=[];
  });
  S.cats.forEach(c=>{if(!S.items[c.id])S.items[c.id]=[];});
  // Ensure budget state exists (for upgrades from older saved data)
  if(!S.budget)S.budget={salary:0,payday:25,expenses:[],ticked:{},remindersOn:false,generated:{},calMonth:null,grocFilter:'All'};
  const now=new Date();
  S.budget.calMonth={year:now.getFullYear(),month:now.getMonth()};
  if(!S.budget.grocFilter)S.budget.grocFilter='All';
  applyDark();
  updateBtns();
  if(!S.name){
    document.getElementById('onboard').style.display='flex';
    return;
  }
  document.getElementById('topName').textContent=S.name+"'s Ledger";
  render();
  checkBanners();
  checkPayBanner();
  setInterval(checkBanners,60000);
  setInterval(checkPayBanner,60000);
}
function save(){db.set('dl_v3',S);}

/* ==================== HELPERS ==================== */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=n=>(S.currency||'R')+' '+Number(n||0).toFixed(2);
const todayStr=()=>new Date().toISOString().slice(0,10);
const isPast=(d,t='23:59')=>d?new Date(d+'T'+t)<new Date():false;
const dueDate=it=>it.date?new Date(it.date+'T'+(it.time||'23:59')):null;
const classify=it=>{if(it.done)return'done';const d=dueDate(it);return(d&&d<=new Date())?'missed':'active';};
const pTag=p=>`<span class="ptag ${p||'medium'}">${p||'medium'}</span>`;
const sTag=s=>s==='done'?'<span class="stag done">Done</span>':s==='missed'?'<span class="stag missed">Missed</span>':'';
const favBtn=it=>`<button class="ab fav-btn ${it.fav?'on':''}" data-act="fav">♥</button>`;

/* ==================== DARK ==================== */
function applyDark(){
  document.body.classList.toggle('dark',S.dark);
  document.getElementById('darkBtn').textContent=S.dark?'Light':'Dark';
  document.getElementById('darkBtn').className='t-btn'+(S.dark?' on':'');
}
document.getElementById('darkBtn').onclick=()=>{S.dark=!S.dark;applyDark();save();};

/* ==================== REMINDERS ==================== */
function updateBtns(){
  const rb=document.getElementById('remindBtn');
  rb.className='t-btn'+(S.reminders?' on':'');
  rb.textContent=S.reminders?'Reminders ON':'Reminders';
}
document.getElementById('remindBtn').onclick=async()=>{
  S.reminders=!S.reminders;
  if(S.reminders&&'Notification'in window&&Notification.permission==='default'){
    try{await Notification.requestPermission();}catch(e){}
  }
  save();updateBtns();
};

/* ==================== BANNERS ==================== */
function checkBanners(){
  const now=new Date();
  const banner=document.getElementById('dueBanner');
  const overdue=[];
  ['todo_personal','todo_work'].concat(S.cats.map(c=>c.id)).forEach(id=>{
    (S.items[id]||[]).forEach(it=>{
      if(!it.done&&it.date){const d=dueDate(it);if(d&&d<=now)overdue.push(it);}
    });
  });
  if(overdue.length){
    banner.className='banner due show';
    banner.innerHTML=`<div class="banner-title">Overdue tasks (${overdue.length})</div>${overdue.map(it=>'• '+esc(it.title)+' — '+it.date+(it.time?' at '+it.time:'')).join('<br>')}`;
    if(S.reminders&&now.getHours()>=20&&'Notification'in window&&Notification.permission==='granted'){
      const d=now.toISOString().slice(0,10);
      if(notifLastDay!==d){new Notification('Overdue tasks',{body:overdue.length+' task(s) overdue'});notifLastDay=d;}
    }
  }else{banner.className='banner due';}
}

/* ==================== BUDGET HELPERS ==================== */
const bMonthKey=(y,m)=>y+'-'+String(m+1).padStart(2,'0');
const bThisMonthKey=()=>{const n=new Date();return bMonthKey(n.getFullYear(),n.getMonth());};
const bThisYear=()=>new Date().getFullYear();
const bThisMonth=()=>new Date().getMonth();
const bTodayNum=()=>new Date().getDate();
const bFmt=n=>(S.currency||'R')+' '+Number(n||0).toFixed(2);
function ordinal(n){const s=['th','st','nd','rd'];const v=n%100;return s[(v-20)%10]||s[v]||s[0];}
function getTicked(mk){return S.budget.ticked[mk]||{};}
function allExpensesDone(mk){
  if(!S.budget.expenses.length)return true;
  const t=getTicked(mk);return S.budget.expenses.every(e=>t[e.id]);
}
function allGroceriesDone(){
  const g=S.items.grocery||[];
  if(!g.length)return true;
  return g.every(it=>it.done);
}
function grocTotal(){return (S.items.grocery||[]).filter(g=>!g.done).reduce((s,g)=>s+(g.qty||0)*(g.price||0),0);}
function grocTotalAll(){return (S.items.grocery||[]).reduce((s,g)=>s+(g.qty||0)*(g.price||0),0);}

function checkPayBanner(){
  const banner=document.getElementById('payBanner');
  if(!banner)return;
  if(!S.budget.salary){banner.className='pay-banner';return;}
  const now=new Date();
  const mk=bThisMonthKey();
  const done=allExpensesDone(mk);
  const isPaydayOrLater=bTodayNum()>=(S.budget.payday||25);
  const isEveningOrLater=now.getHours()>=20;
  const shouldRemind=!done&&isPaydayOrLater&&S.budget.expenses.length>0;
  if(shouldRemind){
    const unticked=S.budget.expenses.filter(e=>!getTicked(mk)[e.id]);
    banner.className='pay-banner show';
    banner.innerHTML=`<strong>Payday reminder!</strong>It's payday time — please prioritise your monthly bills first!<br>${unticked.length} bill${unticked.length!==1?'s':''} still unpaid: ${unticked.map(e=>esc(e.name)).join(', ')}`;
    if(isEveningOrLater&&S.budget.remindersOn&&'Notification'in window&&Notification.permission==='granted'){
      const d=now.toISOString().slice(0,10);
      if(db.get('bl_notif_day')!==d){new Notification('Payday reminder',{body:unticked.length+' unpaid bill(s). Pay your bills first!'});db.set('bl_notif_day',d);}
    }
  }else{banner.className='pay-banner';}
}

/* ==================== TABS ==================== */
document.getElementById('mainTabs').addEventListener('click',e=>{
  const btn=e.target.closest('.tab');if(!btn)return;
  const tab=btn.getAttribute('data-tab');
  if(tab==='addcat'){openCatModal();return;}
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeTab=tab;
  if(tab==='todo')activeSub='personal';
  if(tab==='budget')activeBudgetSub='overview';
  S.histOpen={};
  render();
});

/* ==================== RENDER ==================== */
function render(){
  buildSubtabs();
  const pg=document.getElementById('page');
  if(activeTab==='todo')        pg.innerHTML=renderTodo();
  else if(activeTab==='budget') pg.innerHTML=renderBudget();
  else if(activeTab==='future') pg.innerHTML=renderFuture('future');
  else if(activeTab==='settings')pg.innerHTML=renderSettings();
  else{
    const cat=S.cats.find(c=>c.id===activeTab);
    if(!cat){pg.innerHTML='<div class="empty">Category not found.</div>';return;}
    if(cat.type==='checklist')  pg.innerHTML=renderChecklist(cat.id);
    else if(cat.type==='grocery')pg.innerHTML=renderGrocery(cat.id);
    else if(cat.type==='goal')  pg.innerHTML=renderFuture(cat.id);
    else if(cat.type==='sticky')pg.innerHTML=renderSticky(cat.id);
    else pg.innerHTML='<div class="empty">Unknown type.</div>';
  }
  attachEvents();
}

function buildSubtabs(){
  const bar=document.getElementById('subtabBar');
  if(activeTab==='todo'){
    bar.className='subtab-bar show';
    bar.innerHTML=[['personal','Personal To-Do'],['work','Work To-Do']].map(([k,l])=>
      `<button class="stab ${activeSub===k?'active':''}" data-sub="${k}">${l}</button>`
    ).join('');
    bar.querySelectorAll('.stab').forEach(b=>b.onclick=()=>{activeSub=b.getAttribute('data-sub');render();});
  }else if(activeTab==='budget'){
    bar.className='subtab-bar show';
    bar.innerHTML=[['overview','Overview'],['expenses','Bills'],['grocery','Grocery'],['calendar','Calendar'],['settings','Settings']].map(([k,l])=>
      `<button class="stab ${activeBudgetSub===k?'active':''}" data-bsub="${k}">${l}</button>`
    ).join('');
    bar.querySelectorAll('.stab').forEach(b=>b.onclick=()=>{activeBudgetSub=b.getAttribute('data-bsub');render();});
  }else{
    bar.className='subtab-bar';
  }
}

/* ==================== TO-DO ==================== */
function renderTodo(){
  const listId=activeSub==='work'?'todo_work':'todo_personal';
  const isWork=activeSub==='work';
  const all=S.items[listId]||[];
  const priO={high:0,medium:1,low:2};
  const active=all.filter(i=>classify(i)==='active').sort((a,b)=>(priO[a.priority||'medium'])-(priO[b.priority||'medium'])||(a.date||'').localeCompare(b.date||''));
  const hist=all.filter(i=>classify(i)!=='active').sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  let html=`<div class="card">
    <div class="card-label">Add ${isWork?'work':'personal'} task</div>
    <div class="fg">
      <label>Task title <span class="req">*</span></label>
      <input type="text" id="fTitle" placeholder="What needs doing?" maxlength="120">
      <span class="err-msg" id="fTitleErr">Please enter a task title.</span>
    </div>
    <div class="fg">
      <label>Description</label>
      <textarea id="fDesc" rows="2" placeholder="More details (optional)"></textarea>
    </div>
    <div class="frow">
      <div class="fg">
        <label>Date <span class="req">*</span></label>
        <input type="date" id="fDate" min="${todayStr()}">
        <span class="err-msg" id="fDateErr">Please select a date.</span>
      </div>
      <div class="fg">
        <label>Time <span class="req">*</span></label>
        <input type="time" id="fTime">
        <span class="err-msg" id="fTimeErr">Please select a time.</span>
      </div>
    </div>
    <div class="fg">
      <label>Priority <span class="req">*</span></label>
      <select id="fPri">
        <option value="">— Select priority —</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <span class="err-msg" id="fPriErr">Please select a priority.</span>
    </div>
    <button class="btn primary" id="fAddTodo" data-list="${listId}">Add task</button>
  </div>
  <div class="card">
    ${active.length?active.map(it=>todoRow(it,listId,false)).join(''):'<div class="empty">No active tasks. Add one above.</div>'}
  </div>`;
  if(hist.length)html+=histBlock(listId,hist,it=>todoRow(it,listId,true),'todo');
  return html;
}

function todoRow(it,listId,isHist){
  const st=classify(it);const late=st==='missed'&&!it.done;
  return`<div class="list-item" data-id="${it.id}" data-list="${listId}">
    <input type="checkbox" class="li-check" ${it.done?'checked':''} data-act="toggle">
    <div class="li-body">
      <div class="li-title ${it.done?'done':''}">${isHist?sTag(st)+' ':''}${pTag(it.priority)} ${esc(it.title)}</div>
      ${it.desc?`<div class="li-desc">${esc(it.desc)}</div>`:''}
      <div class="li-meta ${late?'late':''}">${late?'OVERDUE — ':''}${it.date||'No date'}${it.time?' at '+it.time:''}</div>
    </div>
    ${favBtn(it)}
    <div class="li-actions">
      <button class="ab" data-act="edit">Edit</button>
      <button class="ab" data-act="del">✕</button>
    </div>
  </div>`;
}

/* ==================== GROCERY ==================== */
function renderGrocery(catId){
  const all=S.items[catId]||[];
  const unbought=all.filter(g=>!g.done);
  const bought=all.filter(g=>g.done);
  const total=unbought.reduce((s,g)=>s+(g.qty||0)*(g.price||0),0);

  let html=`<div class="card">
    <div class="card-label">Add item</div>
    <div class="fg">
      <label>Item name <span class="req">*</span></label>
      <input type="text" id="gName" placeholder="e.g. Milk, Bread" maxlength="80">
      <span class="err-msg" id="gNameErr">Please enter an item name.</span>
    </div>
    <div class="frow">
      <div class="fg">
        <label>Quantity <span class="req">*</span></label>
        <input type="number" id="gQty" placeholder="1" min="0.1" step="0.1">
        <span class="err-msg" id="gQtyErr">Please enter a quantity.</span>
      </div>
      <div class="fg">
        <label>Unit price <span class="req">*</span></label>
        <input type="number" id="gPrice" placeholder="0.00" min="0.01" step="0.01">
        <span class="err-msg" id="gPriceErr">Please enter a price.</span>
      </div>
    </div>
    <button class="btn primary" id="gAddBtn" data-cat="${catId}">Add item</button>
  </div>
  <div class="card">
    <div class="card-label">Shopping list</div>
    ${unbought.length?unbought.map(g=>grocRow(g,catId)).join('')+'<div class="total-row"><span class="total-lbl">Total to buy</span><span class="total-val">'+fmt(total)+'</span></div>':'<div class="empty">No items yet. Add one above.</div>'}
  </div>`;
  if(bought.length)html+=histBlock(catId,bought,g=>grocRow(g,catId),'groc');
  return html;
}

function grocRow(g,catId){
  const sub=(g.qty||0)*(g.price||0);
  return`<div class="list-item" data-id="${g.id}" data-list="${catId}">
    <input type="checkbox" class="li-check" ${g.done?'checked':''} data-act="toggle">
    <div class="li-body">
      <div class="li-title ${g.done?'done':''}">${esc(g.name)}</div>
      <div class="li-meta">Qty: ${g.qty} × ${fmt(g.price||0)}</div>
    </div>
    <div class="li-amount">${fmt(sub)}</div>
    ${favBtn(g)}
    <div class="li-actions">
      <button class="ab" data-act="edit">Edit</button>
      <button class="ab" data-act="del">✕</button>
    </div>
  </div>`;
}

/* ==================== BUDGET ==================== */
function gateCard(title,msg){
  return`<div class="card gate-card">
    <div class="card-label">${title}</div>
    <p>${msg}</p>
    <button class="btn primary" data-act="goBudgetSettings">Go to Settings</button>
  </div>`;
}

function renderBudget(){
  if(activeBudgetSub==='overview')      return renderBudgetOverview();
  if(activeBudgetSub==='expenses')      return renderBudgetExpenses();
  if(activeBudgetSub==='grocery')       return renderBudgetGrocery();
  if(activeBudgetSub==='calendar')      return renderBudgetCalendar();
  if(activeBudgetSub==='settings')      return renderBudgetSettings();
  return'';
}

function renderBudgetOverview(){
  const b=S.budget;
  if(!b.salary){
    return gateCard('Get started with your budget','Add your monthly salary and pay day in Settings first. Once that\'s set, you can add your monthly bills and grocery items.');
  }
  const mk=bThisMonthKey();
  const ticked=getTicked(mk);
  const totalExp=b.expenses.reduce((s,e)=>s+(e.amount||0),0);
  const paidExp=b.expenses.filter(e=>ticked[e.id]).reduce((s,e)=>s+(e.amount||0),0);
  const totalGroc=grocTotalAll();
  const pct=totalExp>0?Math.min((totalExp/(b.salary||1))*100,100):0;
  const pctClass=pct>90?'over':pct>70?'warn':'';
  const done=allExpensesDone(mk);
  const hasExp=b.expenses.length>0;
  const hasGroc=(S.items.grocery||[]).length>0;

  let html=`<div class="salary-banner">
    <div class="sb-label">Monthly salary — ${MONTHS[bThisMonth()]} ${bThisYear()}</div>
    <div class="sb-amount">${bFmt(b.salary)}</div>
    <div class="sb-sub">Pay day: ${b.payday}${ordinal(b.payday)} of each month</div>
  </div>`;

  html+=`<div class="summary-grid">
    <div class="summary-box red"><div class="sb-lbl">Total bills</div><div class="sb-val">${bFmt(totalExp)}</div></div>
    <div class="summary-box gold"><div class="sb-lbl">Grocery spend</div><div class="sb-val">${bFmt(totalGroc)}</div></div>
    <div class="summary-box green"><div class="sb-lbl">Paid so far</div><div class="sb-val">${bFmt(paidExp)}</div></div>
  </div>`;

  html+=`<div class="card">
    <div class="card-label">Bills paid this month</div>
    <div class="prog-bg"><div class="prog-fill ${pctClass}" style="width:${pct}%"></div></div>
    <div class="li-meta" style="margin-top:6px;">${bFmt(totalExp)} of ${bFmt(b.salary)} salary${pct>90?' — warning: bills exceed 90% of salary!':''}</div>
  </div>`;

  if(!hasExp){
    html+=`<div class="card"><div class="empty">Add your monthly bills in the Bills tab to generate a report.</div></div>`;
  }else{
    html+=`<button class="btn accent" id="generateBtn" style="margin-bottom:14px;">Generate Monthly Report</button>`;
    if(!hasGroc)html+=`<div class="li-meta" style="margin:-8px 0 14px;">This will be a bills-only report — add grocery items for a full report including groceries.</div>`;
    const gen=b.generated&&b.generated[mk];
    if(gen){
      const pos=gen.leftover>=0;
      html+=`<div class="result-banner ${pos?'positive':'negative'}">
        <div class="rb-label">${pos?'You will have left over':'You are overspending by'}</div>
        <div class="rb-amount">${bFmt(Math.abs(gen.leftover))}</div>

function renderBudgetCalendar(){
  const b=S.budget;
  if(!b.salary)return gateCard('Add your salary first','Add your salary and pay day in Settings to see your bill calendar.');
  const{year,month}=b.calMonth;
  const mk=bMonthKey(year,month);
  const ticked=getTicked(mk);
  const now=new Date();
  const isThisMonth=year===now.getFullYear()&&month===now.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const daysInPrev=new Date(year,month,0).getDate();
  const dueDays={};
  b.expenses.forEach(e=>{if(e.dueDay)dueDays[e.dueDay]=true;});

  let html=`<div class="card">
    <div class="cal-header">
      <button class="cal-nav" data-act="calPrev">&#8249;</button>
      <div class="cal-title">${MONTHS[month]} ${year}</div>
      <button class="cal-nav" data-act="calNext">&#8250;</button>
    </div>
    <div class="cal-grid">`;
  DAYS.forEach(d=>{html+=`<div class="cal-day-name">${d}</div>`;});
  for(let i=0;i<firstDay;i++)html+=`<div class="cal-day other-month">${daysInPrev-firstDay+i+1}</div>`;
  for(let d=1;d<=daysInMonth;d++){
    const isToday=isThisMonth&&d===now.getDate();
    const isPayday=d===b.payday;
    const hasExp=!!dueDays[d];
    let cls='cal-day';
    if(isToday)cls+=' today';
    if(isPayday)cls+=' payday';
    if(hasExp)cls+=' has-exp';
    html+=`<div class="${cls}">${d}</div>`;
  }
  const total=firstDay+daysInMonth;
  const remaining=total%7===0?0:7-(total%7);
  for(let i=1;i<=remaining;i++)html+=`<div class="cal-day other-month">${i}</div>`;
  html+=`</div>
    <div class="cal-legend">
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--p)"></div> Today</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--acc)"></div> Pay day</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--red)"></div> Bill due</div>
    </div>
  </div>`;

  if(b.expenses.length){
    html+=`<div class="card">
      <div class="card-label">Bills due — ${MONTHS[month]}</div>
      <table class="exp-table"><thead><tr><th>Paid</th><th>Bill</th><th>Due</th><th>Amount</th></tr></thead><tbody>`;
    [...b.expenses].sort((a,b2)=>(a.dueDay||99)-(b2.dueDay||99)).forEach(e=>{
      const paid=!!ticked[e.id];
      html+=`<tr class="${paid?'paid':''}" data-eid="${e.id}">
        <td><input type="checkbox" class="exp-check" ${paid?'checked':''} data-act="tick"></td>
        <td class="exp-name">${esc(e.name)}<span class="exp-cat">${esc(e.category||'')}</span></td>
        <td class="li-meta">${e.dueDay?e.dueDay+ordinal(e.dueDay):'Any'}</td>
        <td class="exp-amt">${bFmt(e.amount)}</td>
      </tr>`;
    });
    html+=`</tbody></table></div>`;
  }
  return html;
}

    <div class="gc-title">${isHist?sTag(st)+' ':''}${esc(it.title)}</div>

    <div class="gc-date ${late&&!it.done?'late':''}">Target: ${it.date||'No date'}</div>

    if(!pri){showE('fPriErr','fPri');ok=false;}else hideE('fPriErr','fPri');

  /* Add Checklist */
  const clAddBtn=document.getElementById('clAddBtn');
  if(clAddBtn)clAddBtn.onclick=()=>{
    const t=v('clItem'),d=v('clDate'),tm=v('clTime');
    let ok=true;
    if(!t){showE('clItemErr','clItem');ok=false;}else hideE('clItemErr','clItem');
    if(!d){showE('clDateErr','clDate');ok=false;}else hideE('clDateErr','clDate');
    if(!tm){showE('clTimeErr','clTime');ok=false;}else hideE('clTimeErr','clTime');
    if(!ok)return;
    if(isPast(d,tm)){alert('That date and time is in the past.');return;}
    const catId=clAddBtn.getAttribute('data-cat');
    S.items[catId].push({id:uid(),title:t,date:d,time:tm,done:false,fav:false});
    save();render();

  /* Add Sticky */
  const stAddBtn=document.getElementById('stAddBtn');
  if(stAddBtn)stAddBtn.onclick=()=>{
    const t=v('stTitle'),pri=v('stPri'),d=v('stDate'),tm=v('stTime'),desc=v('stDesc');
    let ok=true;
    if(!t){showE('stTitleErr','stTitle');ok=false;}else hideE('stTitleErr','stTitle');
    if(!pri){showE('stPriErr','stPri');ok=false;}else hideE('stPriErr','stPri');
    if(!d){showE('stDateErr','stDate');ok=false;}else hideE('stDateErr','stDate');
    if(!tm){showE('stTimeErr','stTime');ok=false;}else hideE('stTimeErr','stTime');
    if(!desc){showE('stDescErr','stDesc');ok=false;}else hideE('stDescErr','stDesc');
    if(!ok)return;
    if(isPast(d,tm)){alert('That date and time is in the past.');return;}
    const catId=stAddBtn.getAttribute('data-cat');
    S.items[catId].push({id:uid(),title:t,priority:pri,date:d,time:tm,desc,done:false,fav:false,color:SCOLORS[0]});
    save();render();
  };

  /* Settings */
  const saveSBtn=document.getElementById('saveSettingsBtn');
  if(saveSBtn)saveSBtn.onclick=()=>{
    const n=v('setName');
    if(!n){showE('setNameErr','setName');return;}
    hideE('setNameErr','setName');
    S.name=n;S.currency=document.getElementById('setCurr')?.value||S.currency;
    save();document.getElementById('topName').textContent=S.name+"'s Ledger";
    alert('Saved!');render();
  };
  const darkSw=document.getElementById('darkSw');
  if(darkSw)darkSw.onclick=()=>{S.dark=!S.dark;applyDark();save();render();};
  const remindSw=document.getElementById('remindSw');
  if(remindSw)remindSw.onclick=async()=>{
    S.reminders=!S.reminders;
    if(S.reminders&&'Notification'in window&&Notification.permission==='default'){try{await Notification.requestPermission();}catch(e){}}
    save();updateBtns();render();
  };
  const exportBtn=document.getElementById('exportBtn');
  if(exportBtn)exportBtn.onclick=()=>{
    const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='daily-ledger.json';a.click();
  };
  const resetBtn=document.getElementById('resetBtn');
  if(resetBtn)resetBtn.onclick=()=>{
    if(confirm('This will delete ALL your data permanently. Are you sure?')){localStorage.clear();location.reload();}
  };

  /* History toggles */
  pg.querySelectorAll('[data-act="hist"]').forEach(b=>b.onclick=()=>{
    const k=b.getAttribute('data-hkey');S.histOpen[k]=!S.histOpen[k];render();
  });

  /* Delete category */
  pg.querySelectorAll('[data-act="delcat"]').forEach(b=>b.onclick=()=>{
    const cid=b.getAttribute('data-catid');
    const cat=S.cats.find(c=>c.id===cid);
    openDel('cat',cid,cat?cat.name:'this category',null);
  });

  /* Item events via delegation */
  pg.addEventListener('change',e=>{
    const el=e.target;const act=el.getAttribute('data-act');
    const row=el.closest('[data-id]');if(!row)return;
    const id=row.getAttribute('data-id');const listId=row.getAttribute('data-list');
    const it=(S.items[listId]||[]).find(i=>i.id===id);if(!it)return;
    if(act==='toggle'){it.done=el.checked;save();render();}
    if(act==='progress'){
      it.progress=parseInt(el.value);
      row.querySelector('.prog-pct span:last-child').textContent=it.progress+'%';
      row.querySelector('.prog-fill').style.width=it.progress+'%';
      save();
    }
  });

  pg.addEventListener('click',e=>{
    const el=e.target.closest('[data-act]');if(!el)return;
    const act=el.getAttribute('data-act');
    if(['hist','delcat'].includes(act))return;
    const row=el.closest('[data-id]');if(!row)return;
    const id=row.getAttribute('data-id');const listId=row.getAttribute('data-list');
    const it=(S.items[listId]||[]).find(i=>i.id===id);if(!it)return;
    if(act==='toggle'){it.done=!it.done;save();render();}
    if(act==='fav'){it.fav=!it.fav;save();render();}
    if(act==='color'){it.color=el.getAttribute('data-color');save();render();}
    if(act==='edit')openItemEdit(id,listId);
    if(act==='del')openDel('item',id,it.title||it.name||'this item',listId);

  /* ===== BUDGET EVENTS ===== */

  pg.querySelectorAll('[data-act="goBudgetSettings"]').forEach(b=>b.onclick=()=>{
    activeBudgetSub='settings';render();
  });

  /* Generate report */
  const genBtn=document.getElementById('generateBtn');
  if(genBtn)genBtn.onclick=generateBudgetReport;

  /* Add expense */
  const addExpBtn=document.getElementById('addExpBtn');
  if(addExpBtn)addExpBtn.onclick=()=>openExpModal(null);

  /* Calendar nav */
  const calPrev=pg.querySelector('[data-act="calPrev"]');
  const calNext=pg.querySelector('[data-act="calNext"]');
  if(calPrev)calPrev.onclick=()=>{
    let{year,month}=S.budget.calMonth;month--;if(month<0){month=11;year--;}
    S.budget.calMonth={year,month};render();
  };
  if(calNext)calNext.onclick=()=>{
    let{year,month}=S.budget.calMonth;month++;if(month>11){month=0;year++;}
    S.budget.calMonth={year,month};render();
  };

  /* Grocery category filter pills */
  pg.querySelectorAll('[data-groc-filter]').forEach(b=>b.onclick=()=>{
    S.budget.grocFilter=b.getAttribute('data-groc-filter');save();render();
  });

  /* Budget settings save */
  const saveBudgetBtn=document.getElementById('saveBudgetSettings');
  if(saveBudgetBtn)saveBudgetBtn.onclick=()=>{
    const sal=parseFloat(v('sSalary'));
    if(!sal||sal<=0||isNaN(sal)){showE('sSalaryErr','sSalary');return;}
    hideE('sSalaryErr','sSalary');
    S.budget.salary=sal;
    S.budget.payday=parseInt(v('sPayday'))||25;
    S.currency=document.getElementById('sCurrency')?.value||S.currency;
    save();alert('Budget settings saved!');activeBudgetSub='overview';render();
  };

  /* Budget reminders switch */
  const budgetNotifSw=document.getElementById('budgetNotifSw');
  if(budgetNotifSw)budgetNotifSw.onclick=async()=>{
    S.budget.remindersOn=!S.budget.remindersOn;
    if(S.budget.remindersOn&&'Notification'in window&&Notification.permission==='default'){
      try{await Notification.requestPermission();}catch(e){}
    }
    save();render();
  };

  /* Budget export / reset */
  const exportBudgetBtn=document.getElementById('exportBudgetBtn');
  if(exportBudgetBtn)exportBudgetBtn.onclick=()=>{
    const data={budget:S.budget,grocery:S.items.grocery||[]};
    const bl=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='budget-'+bThisMonthKey()+'.json';a.click();
  };
  const resetBudgetBtn=document.getElementById('resetBudgetBtn');
  if(resetBudgetBtn)resetBudgetBtn.onclick=()=>{
    if(confirm('This will delete all your budget bills, grocery items and settings. Are you sure?')){
      S.budget={salary:0,payday:25,expenses:[],ticked:{},remindersOn:false,generated:{},calMonth:{year:new Date().getFullYear(),month:new Date().getMonth()},grocFilter:'All'};
      S.items.grocery=[];
      save();render();
    }
  };

  /* Expense tick (paid) checkbox */
  pg.querySelectorAll('.exp-check[data-act="tick"]').forEach(cb=>{
    cb.addEventListener('change',e=>{
      const row=e.target.closest('[data-eid]');if(!row)return;
      const eid=row.getAttribute('data-eid');const mk=bThisMonthKey();
      if(!S.budget.ticked[mk])S.budget.ticked[mk]={};
      if(e.target.checked)S.budget.ticked[mk][eid]=true;else delete S.budget.ticked[mk][eid];
      save();checkPayBanner();render();
    });
  });

  /* Edit / delete expense */
  pg.querySelectorAll('[data-act="editExp"]').forEach(b=>b.onclick=e=>{
    const row=e.target.closest('[data-eid]');if(row)openExpModal(row.getAttribute('data-eid'));
  });
  pg.querySelectorAll('[data-act="delExp"]').forEach(b=>b.onclick=e=>{
    const row=e.target.closest('[data-eid]');if(row)openExpDelModal(row.getAttribute('data-eid'));
  });
}

/* ==================== EXPENSE MODAL ==================== */
function openExpModal(id){
  editingExpId=id||null;
  const exp=id?S.budget.expenses.find(e=>e.id===id):null;
  document.getElementById('expModalTitle').textContent=id?'Edit expense':'Add expense';
  document.getElementById('expName').value=exp?exp.name:'';
  document.getElementById('expAmount').value=exp?exp.amount:'';
  document.getElementById('expCategory').value=exp?(exp.category||'Other'):'Other';
  document.getElementById('expDueDay').value=exp?(exp.dueDay||''):'';
  hideE('expNameErr','expName');hideE('expAmountErr','expAmount');
  document.getElementById('expModal').classList.add('show');
}
document.getElementById('expCancel').onclick=()=>{editingExpId=null;document.getElementById('expModal').classList.remove('show');};
document.getElementById('expSave').onclick=()=>{
  const name=v('expName'),amount=parseFloat(v('expAmount')),cat=document.getElementById('expCategory').value,dueDay=parseInt(v('expDueDay'))||null;
  let ok=true;
  if(!name){showE('expNameErr','expName');ok=false;}else hideE('expNameErr','expName');
  if(!amount||amount<=0||isNaN(amount)){showE('expAmountErr','expAmount');ok=false;}else hideE('expAmountErr','expAmount');
  if(!ok)return;
  if(editingExpId){
    const exp=S.budget.expenses.find(e=>e.id===editingExpId);
    if(exp){exp.name=name;exp.amount=amount;exp.category=cat;exp.dueDay=dueDay;}
  }else{
    S.budget.expenses.push({id:uid(),name,amount,category:cat,dueDay});
  }
  editingExpId=null;save();
  document.getElementById('expModal').classList.remove('show');render();
};
function openExpDelModal(id){
  deletingExpId=id;
  const exp=S.budget.expenses.find(e=>e.id===id);
  delType='expense';delId=id;
  document.getElementById('delMsg').textContent='"'+(exp?exp.name:'this expense')+'" will be removed.';
  document.getElementById('delModal').classList.add('show');
}
['expModal'].forEach(mid=>{
  document.getElementById(mid).addEventListener('click',e=>{
    if(e.target===document.getElementById(mid))document.getElementById(mid).classList.remove('show');
  });
});

/* ==================== ITEM EDIT MODAL ==================== */
function getItemType(listId){
  if(listId==='todo_personal'||listId==='todo_work')return'todo';
  if(listId==='grocery')return'grocery';
  if(listId==='future')return'goal';
  const cat=S.cats.find(c=>c.id===listId);
  return cat?cat.type:'checklist';
}

function openItemEdit(id,listId){
  editId=id;editList=listId;
  const it=(S.items[listId]||[]).find(i=>i.id===id);if(!it)return;
  const type=getItemType(listId);
  document.getElementById('itemModalTitle').textContent='Edit item';
  const f=document.getElementById('itemFields');

  if(type==='todo'||type==='checklist'){
    f.innerHTML=`
      <div class="fg"><label>Title <span class="req">*</span></label>
        <input type="text" id="eT" value="${esc(it.title||'')}" maxlength="120">
        <span class="err-msg" id="eTErr">Required.</span></div>
      <div class="fg"><label>Description</label><textarea id="eDesc" rows="2">${esc(it.desc||'')}</textarea></div>
      <div class="frow">
        <div class="fg"><label>Date</label><input type="date" id="eD" value="${it.date||''}"></div>
        <div class="fg"><label>Time</label><input type="time" id="eTm" value="${it.time||''}"></div>
      </div>
      ${type==='todo'?`<div class="fg"><label>Priority</label>
        <select id="ePri">
          <option value="high" ${it.priority==='high'?'selected':''}>High</option>
          <option value="medium" ${!it.priority||it.priority==='medium'?'selected':''}>Medium</option>
          <option value="low" ${it.priority==='low'?'selected':''}>Low</option>
        </select></div>`:''}`;
  }else if(type==='grocery'){
    const showCat=editList==='grocery';
    f.innerHTML=`
      <div class="fg"><label>Name <span class="req">*</span></label>
        <input type="text" id="eN" value="${esc(it.name||'')}" maxlength="80">
        <span class="err-msg" id="eNErr">Required.</span></div>
      ${showCat?`<div class="fg"><label>Category</label>
        <select id="eCat">${GROC_CATS.map(c=>`<option value="${c}" ${it.category===c?'selected':''}>${c}</option>`).join('')}</select></div>`:''}
      <div class="frow">
        <div class="fg"><label>Qty <span class="req">*</span></label>
          <input type="number" id="eQ" value="${it.qty||1}" min="0.1" step="0.1">
          <span class="err-msg" id="eQErr">Required.</span></div>
        <div class="fg"><label>Price <span class="req">*</span></label>
          <input type="number" id="eP" value="${it.price||0}" min="0.01" step="0.01">
          <span class="err-msg" id="ePErr">Required.</span></div>
      </div>`;
  }else if(type==='goal'){
    f.innerHTML=`
      <div class="fg"><label>Title <span class="req">*</span></label>
        <input type="text" id="eGT" value="${esc(it.title||'')}" maxlength="120">
        <span class="err-msg" id="eGTErr">Required.</span></div>
      <div class="fg"><label>Date</label><input type="date" id="eGD" value="${it.date||''}"></div>
      <div class="fg"><label>Description <span class="req">*</span></label>
        <textarea id="eGDesc" rows="3">${esc(it.desc||'')}</textarea>
        <span class="err-msg" id="eGDescErr">Required.</span></div>`;
  }else if(type==='sticky'){
    f.innerHTML=`
      <div class="fg"><label>Title <span class="req">*</span></label>
        <input type="text" id="eST" value="${esc(it.title||'')}" maxlength="120">
        <span class="err-msg" id="eSTErr">Required.</span></div>
      <div class="fg"><label>Priority / label</label>
        <select id="eSPri">
          <option value="high" ${it.priority==='high'?'selected':''}>High</option>
          <option value="medium" ${!it.priority||it.priority==='medium'?'selected':''}>Medium</option>
          <option value="low" ${it.priority==='low'?'selected':''}>Low</option>
        </select></div>
      <div class="frow">
        <div class="fg"><label>Date</label><input type="date" id="eSD" value="${it.date||''}"></div>
        <div class="fg"><label>Time</label><input type="time" id="eSTm" value="${it.time||''}"></div>
      </div>
      <div class="fg"><label>Details <span class="req">*</span></label>
        <textarea id="eSDesc" rows="3">${esc(it.desc||'')}</textarea>
        <span class="err-msg" id="eSDescErr">Required.</span></div>`;
  }

  document.getElementById('itemSave').onclick=()=>{
    const it2=(S.items[editList]||[]).find(i=>i.id===editId);if(!it2)return;
    let ok=true;
    if(type==='todo'||type==='checklist'){
      const t=v('eT');if(!t){showE('eTErr','eT');ok=false;}else{hideE('eTErr','eT');it2.title=t;}
      it2.desc=v('eDesc');it2.date=v('eD');it2.time=v('eTm');
      if(type==='todo')it2.priority=v('ePri');
    }else if(type==='grocery'){
      const n=v('eN'),q=parseFloat(v('eQ')),p=parseFloat(v('eP'));
      if(!n){showE('eNErr','eN');ok=false;}else{hideE('eNErr','eN');it2.name=n;}
      if(!q||q<=0){showE('eQErr','eQ');ok=false;}else{hideE('eQErr','eQ');it2.qty=q;}
      if(!p||p<=0){showE('ePErr','eP');ok=false;}else{hideE('ePErr','eP');it2.price=p;}
      const catSel=document.getElementById('eCat');if(catSel)it2.category=catSel.value;
    }else if(type==='goal'){
      const t=v('eGT'),desc=v('eGDesc');
      if(!t){showE('eGTErr','eGT');ok=false;}else{hideE('eGTErr','eGT');it2.title=t;}
      if(!desc){showE('eGDescErr','eGDesc');ok=false;}else{hideE('eGDescErr','eGDesc');it2.desc=desc;}
      it2.date=v('eGD');
    }else if(type==='sticky'){
      const t=v('eST'),desc=v('eSDesc');
      if(!t){showE('eSTErr','eST');ok=false;}else{hideE('eSTErr','eST');it2.title=t;}
      if(!desc){showE('eSDescErr','eSDesc');ok=false;}else{hideE('eSDescErr','eSDesc');it2.desc=desc;}
      it2.priority=v('eSPri');it2.date=v('eSD');it2.time=v('eSTm');
    }
    if(!ok)return;
    save();document.getElementById('itemModal').classList.remove('show');editId=null;editList=null;render();
  };
  document.getElementById('itemModal').classList.add('show');
}
document.getElementById('itemCancel').onclick=()=>{editId=null;editList=null;document.getElementById('itemModal').classList.remove('show');};

/* ==================== DELETE MODAL ==================== */
function openDel(type,id,label,listId){
  delId=id;delList=listId;delType=type;
  document.getElementById('delMsg').textContent='"'+label+'" will be removed permanently.';
  document.getElementById('delModal').classList.add('show');
}
document.getElementById('delCancel').onclick=()=>{delId=null;delList=null;delType=null;document.getElementById('delModal').classList.remove('show');};
document.getElementById('delConfirm').onclick=()=>{
  if(delType==='item'&&delList)S.items[delList]=(S.items[delList]||[]).filter(i=>i.id!==delId);
  if(delType==='expense'){S.budget.expenses=S.budget.expenses.filter(e=>e.id!==delId);deletingExpId=null;}
  if(delType==='cat'){
    S.cats=S.cats.filter(c=>c.id!==delId);
    delete S.items[delId];
    if(activeTab===delId){activeTab='todo';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.getAttribute('data-tab')==='todo'));}
    rebuildCustomTabs();
  }
  delId=null;delList=null;delType=null;
  save();document.getElementById('delModal').classList.remove('show');render();
};

/* ==================== ADD CATEGORY MODAL ==================== */
function openCatModal(){
  document.getElementById('mCatName').value='';
  document.getElementById('mCatType').value='checklist';
  chosenIcon=ICONS[0];
  const grid=document.getElementById('iconGrid');
  grid.innerHTML=ICONS.map(ic=>`<div class="icon-pick ${ic===chosenIcon?'on':''}" data-icon="${ic}">${ic}</div>`).join('');
  grid.querySelectorAll('.icon-pick').forEach(el=>el.onclick=()=>{
    chosenIcon=el.getAttribute('data-icon');
    grid.querySelectorAll('.icon-pick').forEach(x=>x.classList.remove('on'));
    el.classList.add('on');
  });
  document.getElementById('catModal').classList.add('show');
}
document.getElementById('catCancel').onclick=()=>document.getElementById('catModal').classList.remove('show');
document.getElementById('catSave').onclick=()=>{
  const name=document.getElementById('mCatName').value.trim();
  if(!name){document.getElementById('mCatNameErr').className='err-msg show';document.getElementById('mCatName').classList.add('err');return;}
  document.getElementById('mCatNameErr').className='err-msg';document.getElementById('mCatName').classList.remove('err');
  const type=document.getElementById('mCatType').value;
  const id='cat_'+uid();
  S.cats.push({id,name,type,icon:chosenIcon});
  S.items[id]=[];
  save();
  addCustomTab(id,chosenIcon,name);
  document.getElementById('catModal').classList.remove('show');
  activeTab=id;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.getAttribute('data-tab')===id));
  render();
};

function addCustomTab(id,icon,name){
  const tabs=document.getElementById('mainTabs');
  const addBtn=tabs.querySelector('[data-tab="addcat"]');
  const btn=document.createElement('button');
  btn.className='tab';btn.setAttribute('data-tab',id);
  btn.textContent=icon+' '+name;
  tabs.insertBefore(btn,addBtn);
}

function rebuildCustomTabs(){
  document.querySelectorAll('.tab[data-tab^="cat_"]').forEach(b=>b.remove());
  S.cats.forEach(c=>addCustomTab(c.id,c.icon,c.name));
}

/* Close modals on bg click */
['itemModal','catModal','delModal'].forEach(mid=>{
  document.getElementById(mid).addEventListener('click',e=>{
    if(e.target===document.getElementById(mid))document.getElementById(mid).classList.remove('show');
  });
});

/* ==================== FORM HELPERS ==================== */
const v=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
function showE(eid,iid){
  const e=document.getElementById(eid);if(e)e.className='err-msg show';
  const i=document.getElementById(iid);if(i)i.classList.add('err');
}
function hideE(eid,iid){
  const e=document.getElementById(eid);if(e)e.className='err-msg';
  const i=document.getElementById(iid);if(i)i.classList.remove('err');
}

/* ==================== ONBOARDING ==================== */
document.getElementById('obBtn').onclick=()=>{
  const name=document.getElementById('obName').value.trim();
  if(!name){document.getElementById('obNameErr').className='err-msg show';document.getElementById('obName').classList.add('err');return;}
  document.getElementById('obNameErr').className='err-msg';
  S.name=name;S.currency=document.getElementById('obCurr').value;
  save();document.getElementById('onboard').style.display='none';
  document.getElementById('topName').textContent=S.name+"'s Ledger";
  render();checkBanners();checkPayBanner();setInterval(checkBanners,60000);setInterval(checkPayBanner,60000);
};

/* ==================== BOOT ==================== */
boot();
</script>
